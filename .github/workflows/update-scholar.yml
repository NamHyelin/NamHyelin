name: Update Scholar publications

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'

permissions:
  contents: write

concurrency:
  group: scholar-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Scholar and build README table
        run: python scripts/update_scholar.py
      - name: Save snapshot and README
        run: |
          git add -- README.md data/scholar.json
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Scholar publications'
          git pull --rebase
          git push
